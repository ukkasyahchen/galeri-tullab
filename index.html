<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أسماء الطلبة</title>
  <meta name="description" content="Galeri Digital - unduh PNG">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Public+Sans:wght@400;500;600&family=Fragment+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar__in">
      <img class="topbar__left" src="img/brand-left.png" alt="" aria-hidden="true" width="238" height="102" decoding="async">
      <a class="brand" href="#top">
        <img class="brand__img" src="img/brand-center.png" alt="Galeri Tullab" width="605" height="102" decoding="async">
      </a>
      <img class="topbar__logo" src="img/logo.png" alt="" aria-hidden="true" width="70" height="102" decoding="async">
    </div>
  </header>

  <main id="top">

    <!-- TOOLBAR -->
    <section class="toolbar" id="koleksi">
      <div class="container toolbar__in">
        <label class="search" for="q">
          <svg class="search__ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg>
          <input class="search__f" id="q" type="search" placeholder="Cari nama — arab, latin, atau nomor" autocomplete="off" spellcheck="false" aria-label="Cari nama">
          <button class="search__x" id="qx" type="button" aria-label="Hapus pencarian" hidden>
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </label>

        <div class="sorts" id="sorts" role="tablist" aria-label="Urutkan">
          <button class="sorts__b active" role="tab" aria-selected="true" data-sort="n">Nomor Absen</button>
        </div>

        <p class="toolbar__meta" id="stat-count">50 nama · PNG transparan</p>
      </div>
    </section>

    <!-- GALLERY -->
    <section class="gallery-sec">
      <div class="container">
        <div class="gallery" id="gallery"></div>

        <div class="empty" id="empty" hidden>
          <span class="empty__g" aria-hidden="true">∅</span>
          <p class="empty__t">Tidak ada nama <span id="empty-q"></span></p>
          <p class="empty__d">Coba potongan nama lain, atau nomor urut seperti <em>12</em>.</p>
          <button class="btn btn--primary" id="empty-reset" type="button">Tampilkan semua</button>
        </div>
      </div>
    </section>

  </main>

  <!-- LIGHTBOX -->
  <div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Pratinjau kaligrafi">
    <div class="lb__bd" id="lb-bd"></div>
    <div class="lb__frame">
      <div class="lb__panel">
        <header class="lb__bar">
          <span class="lb__no" id="lb-no"></span>
          <span class="lb__name" id="lb-name" dir="rtl" lang="ar"></span>
          <button class="lb__x" id="lb-x" aria-label="Tutup">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </header>
        <div class="lb__stage">
          <button class="lb__nav lb__nav--p" id="lb-p" aria-label="Sebelumnya">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </button>
          <img class="lb__img" id="lb-img" src="" alt="">
          <button class="lb__nav lb__nav--n" id="lb-n" aria-label="Berikutnya">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </button>
        </div>
        <footer class="lb__foot">
          <span class="lb__meta" id="lb-meta"></span>
          <button class="btn btn--primary" id="lb-dl">Unduh PNG</button>
        </footer>
      </div>
    </div>
  </div>

  <script src="manifest.js"></script>
  <script src="script.js"></script>
</body>
</html>
